spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/authentication-service}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
server:
  port: ${PORT:9082}
  address: 0.0.0.0
app:
  # Comma-separated tenants this instance serves; each has its own authentication-<customer> DB.
  customers: ${CUSTOMERS:dearlavion}
  # Secret required (via X-Provision-Secret) to set a privileged role at register/update time.
  # Empty => privileged roles can never be assigned through the API (fail closed).
  provision-secret: ${PROVISION_SECRET:}
  # Base64 HMAC secret. No real default on purpose (unlike the sibling v1/v2 services, which bake
  # a secret into source) — for v1/v2/v3 tokens to interoperate, JWT_SECRET must be set explicitly
  # to the same value the other running instances use. This placeholder deliberately does NOT match
  # them, so a misconfigured deploy fails to verify tokens loudly instead of silently trusting a
  # secret that happens to be sitting in git history.
  jwt-secret-base64: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_SET_JWT_SECRET_ENV_VAR}
  jwt-expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:86400}
  jwt-reset-expires-in-seconds: ${JWT_RESET_EXPIRES_IN_SECONDS:900}
  kafka-enabled: ${KAFKA_ENABLED:true}
  kafka-client-id: ${KAFKA_CLIENT_ID:dearlavion-spring-authentication-service-v3}
  google-enabled: ${GOOGLE_ENABLED:true}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  frontend-origins: ${FRONTEND_ORIGINS:}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
